{{- if .Values.observability.enabled }}
{{- if .Values.observability.prometheus.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-support-platform.fullname" . }}-prometheus
  labels:
    {{- include "ai-support-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.observability.prometheus.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.observability.prometheus.persistence.size }}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-support-platform.fullname" . }}-prometheus
  labels:
    {{- include "ai-support-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "ai-support-platform.componentLabels" (dict "root" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/observability-config: {{ include (print $.Template.BasePath "/observability-configmaps.yaml") . | sha256sum }}
      labels:
        {{- include "ai-support-platform.componentLabels" (dict "root" . "component" "prometheus") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-support-platform.platformServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: {{ .Values.podSecurity.seccompProfile }}}
      containers:
        - name: prometheus
          image: "{{ .Values.observability.prometheus.image.repository }}:{{ .Values.observability.prometheus.image.tag }}"
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.observability.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ include "ai-support-platform.fullname" . }}-prometheus}
        - name: data
          {{- if .Values.observability.prometheus.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "ai-support-platform.fullname" . }}-prometheus}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-support-platform.fullname" . }}-prometheus
  labels:
    {{- include "ai-support-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  selector:
    {{- include "ai-support-platform.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
  ports:
    - {name: http, port: 9090, targetPort: http}
{{- end }}
