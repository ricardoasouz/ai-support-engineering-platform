{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-support-platform.secretName" . }}
  labels:
    {{- include "ai-support-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.values.databaseUrl is required when secrets.create=true" .Values.secrets.values.databaseUrl | quote }}
  {{ .Values.secrets.keys.postgresPassword }}: {{ required "secrets.values.postgresPassword is required when secrets.create=true" .Values.secrets.values.postgresPassword | quote }}
  {{ .Values.secrets.keys.grafanaAdminPassword }}: {{ required "secrets.values.grafanaAdminPassword is required when secrets.create=true" .Values.secrets.values.grafanaAdminPassword | quote }}
{{- end }}
