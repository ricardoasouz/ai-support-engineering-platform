{{- if .Values.serviceAccounts.create }}
{{- range $component := list "api" "worker" "jobs" "platform" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ if eq $component "api" }}{{ include "ai-support-platform.apiServiceAccountName" $ }}{{ else if eq $component "worker" }}{{ include "ai-support-platform.workerServiceAccountName" $ }}{{ else if eq $component "jobs" }}{{ include "ai-support-platform.jobsServiceAccountName" $ }}{{ else }}{{ include "ai-support-platform.platformServiceAccountName" $ }}{{ end }}
  labels:
    {{- include "ai-support-platform.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
