name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Verify dependency lock files are synchronized
        run: |
          python -m pip install uv

          uv pip compile \
            requirements.txt \
            --universal \
            --python-version 3.14 \
            --generate-hashes \
            --output-file requirements.lock

          uv pip compile \
            requirements-dev.txt \
            --universal \
            --python-version 3.14 \
            --generate-hashes \
            --output-file requirements-dev.lock

          git diff --exit-code -- \
            requirements.lock \
            requirements-dev.lock

      - name: Validate example configuration
        run: python scripts/validate_config.py --env-file .env.example
      - name: Run unit tests
        run: python -m pytest -m unit -q
      - name: Run Ruff
        run: python -m ruff check app tests integration_tests scripts migrations
      - name: Check Ruff formatting
        run: python -m ruff format --check app tests integration_tests scripts migrations
      - name: Compile Python
        run: python -m compileall -q app tests integration_tests scripts migrations
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Audit runtime dependencies
        run: python -m pip_audit --require-hashes --requirement requirements.lock
      - name: Check patch whitespace
        run: git diff --check

  security:
    name: Supply-chain and image gates
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install SBOM tooling
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner --exit-code=1 /repo
      - name: Scan repository filesystem
        run: >-
          docker run --rm -v "$PWD:/src" aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c fs
          --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,misconfig
          --skip-dirs /src/.git --skip-dirs /src/.venv /src
      - name: Derive immutable build metadata
        run: |
          echo "BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Build API and worker images
        run: |
          docker build --build-arg APP_VERSION="$APP_VERSION" --build-arg GIT_SHA="$GITHUB_SHA" --build-arg BUILD_TIME="$BUILD_TIME" --tag "ai-support-api:$GITHUB_SHA" .
          docker build --build-arg APP_VERSION="$APP_VERSION" --build-arg GIT_SHA="$GITHUB_SHA" --build-arg BUILD_TIME="$BUILD_TIME" --tag "ai-support-worker:$GITHUB_SHA" .
      - name: Scan API image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln "ai-support-api:$GITHUB_SHA"
      - name: Scan worker image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --exit-code 1 --severity HIGH,CRITICAL --scanners vuln "ai-support-worker:$GITHUB_SHA"
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p security-reports
          cyclonedx-py requirements requirements.lock --output-reproducible --of JSON -o security-reports/python.cdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-reports:/reports" aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --format cyclonedx --output /reports/api-image.cdx.json "ai-support-api:$GITHUB_SHA"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/security-reports:/reports" aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --format cyclonedx --output /reports/worker-image.cdx.json "ai-support-worker:$GITHUB_SHA"
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-sboms-${{ github.sha }}
          path: security-reports/*.json
          if-no-files-found: error
          retention-days: 14
