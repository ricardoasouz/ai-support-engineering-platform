x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_INCIDENT_CREATED_TOPIC: ${KAFKA_INCIDENT_CREATED_TOPIC:-incident.created}
  KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-incident-processing-v1}
  KAFKA_PRODUCER_CLIENT_ID: ${KAFKA_PRODUCER_CLIENT_ID:-support-api}
  KAFKA_PRODUCER_ACKS: ${KAFKA_PRODUCER_ACKS:-all}
  KAFKA_PRODUCER_ENABLE_IDEMPOTENCE: ${KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:-true}
  KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:-5000}
  KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES:-5}
  KAFKA_OUTBOX_POLL_INTERVAL_SECONDS: ${KAFKA_OUTBOX_POLL_INTERVAL_SECONDS:-5}
  KAFKA_OUTBOX_BATCH_SIZE: ${KAFKA_OUTBOX_BATCH_SIZE:-20}
  KAFKA_WORKER_CLIENT_ID: ${KAFKA_WORKER_CLIENT_ID:-incident-worker}
  KAFKA_WORKER_POLL_TIMEOUT_SECONDS: ${KAFKA_WORKER_POLL_TIMEOUT_SECONDS:-1}
  KAFKA_WORKER_MAX_POLL_INTERVAL_MS: ${KAFKA_WORKER_MAX_POLL_INTERVAL_MS:-900000}
  KAFKA_WORKER_RETRY_BACKOFF_SECONDS: ${KAFKA_WORKER_RETRY_BACKOFF_SECONDS:-2}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:1.5b-instruct}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
  OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-180}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/app/knowledge_base}
  KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-900}
  KNOWLEDGE_RETRIEVAL_TOP_K: ${KNOWLEDGE_RETRIEVAL_TOP_K:-4}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-5}
  AI_PROCESSING_STALE_SECONDS: ${AI_PROCESSING_STALE_SECONDS:-900}
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
  AGENT_MAX_REPEATED_TOOL_CALLS: ${AGENT_MAX_REPEATED_TOOL_CALLS:-1}
  AGENT_MAX_RETRIEVAL_CHUNKS: ${AGENT_MAX_RETRIEVAL_CHUNKS:-4}
  AGENT_MAX_DURATION_SECONDS: ${AGENT_MAX_DURATION_SECONDS:-600}
  AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-180}
  AGENT_MODEL_RETRIES: ${AGENT_MODEL_RETRIES:-3}
  AGENT_REPAIR_ATTEMPTS: ${AGENT_REPAIR_ATTEMPTS:-2}
  AGENT_PLANNER_PROMPT_VERSION: ${AGENT_PLANNER_PROMPT_VERSION:-v1}
  AGENT_RESOLVER_PROMPT_VERSION: ${AGENT_RESOLVER_PROMPT_VERSION:-v1}

services:
  db:
    image: pgvector/pgvector:0.8.5-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.32.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$${OLLAMA_LLM_MODEL}" &&
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:1.5b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
          --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0
        --port 8000 --workers ${API_WORKERS:-2} --no-access-log
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    command:
      - sh
      - -c
      - >-
        python -m app.knowledge.ingest &&
        exec python -m app.workers.incident_worker
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/incident-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  ollama_models:
